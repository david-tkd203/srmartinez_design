<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Portal | Dashboard</title>
    <link rel="icon" type="image/png" href="./logo/logo_sinfondo.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            padding: 4rem 2rem;
            min-height: 100vh;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(255, 208, 47, 0.2);
            padding-bottom: 1rem;
        }
        .header-dash h2 {
            color: var(--color-primary);
            font-size: 2.5rem;
        }
        .grid-dash {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }
        .dash-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .dash-card input, .dash-card textarea, .dash-card select {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 0.5rem;
            border-radius: 4px;
            font-family: 'Poppins', sans-serif;
            width: 100%;
        }
        .actions {
            display: flex;
            gap: 1rem;
            margin-top: auto;
        }
        .btn-save { background: var(--color-primary); color: var(--color-bg); padding: 0.5rem 1rem; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; flex: 1; }
        .btn-delete { background: #ff4444; color: white; padding: 0.5rem 1rem; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; flex: 1; }
        .btn-save:hover { filter: brightness(1.1); }
        .btn-delete:hover { filter: brightness(1.1); }
        .video-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; background: #000; }
        .file-input-group label { font-size: 0.8rem; color: #aaa; margin-bottom: 0.2rem; display: block; }
        .file-input-group input[type="file"] { font-size: 0.8rem; padding: 0.3rem; }
            @media (max-width: 768px) {
            body { padding: 2rem 1rem !important; }
            .stats-container, .dashboard-container, .upload-container { padding: 0 !important; width: 100%; box-sizing: border-box; }
            .table-container { padding: 1rem !important; }
            .dash-card { padding: 1rem !important; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <datalist id="category-options">
            <option value="Prendas Personalizadas"></option>
            <option value="VehÃ­culos Personalizados"></option>
            <option value="Mapeos"></option>
            <option value="Scripts"></option>
            <option value="Otros"></option>
        </datalist>

        <div class="admin-menu">
            <a href="/design-dashboard.html" class="active">Panel de DiseÃ±os</a>
            <a href="/design-upload.html">Subir Nuevo</a>
            <a href="/admin-stats.html">EstadÃ­sticas y Visitas</a>
            <button onclick="logout()">Cerrar SesiÃ³n</button>
        </div>

        <div class="header-dash">
            <h2 class="gta-font">Panel de DiseÃ±os</h2>
        </div>

        <div class="grid-dash" id="dashGrid">
            <p>Cargando diseÃ±os...</p>
        </div>
    </div>

    <script>
        const logout = async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/login.html';
        };

        const loadDashboard = async () => {
            const grid = document.getElementById('dashGrid');
            try {
                const res = await fetch('/api/designs');
                const designs = await res.json();
                grid.innerHTML = '';
                
                if(designs.length === 0) {
                    grid.innerHTML = '<p>No hay diseÃ±os subidos todavÃ­a.</p>';
                    return;
                }

                designs.forEach(d => {
                    const card = document.createElement('div');
                    card.className = 'dash-card';
                    card.innerHTML = `
                        <video class="video-preview" src="${d.videoUrl}" muted playsinline></video>
                        <div>
                            <label>TÃ­tulo:</label>
                            <input type="text" id="title-${d.id}" value="${d.title}">
                        </div>
                        <div>
                            <label>CategorÃ­a:</label>
                            <input type="text" id="category-${d.id}" value="${d.category || 'Prendas Personalizadas'}" list="category-options" placeholder="Nueva CategorÃ­a">
                        </div>
                        <div>
                            <label>GÃ©nero (Si aplica):</label>
                            <select id="gender-${d.id}">
                                <option value="Hombre" ${d.gender==='Hombre'?'selected':''}>Hombre</option>
                                <option value="Mujer" ${d.gender==='Mujer'?'selected':''}>Mujer</option>
                                <option value="Unisex" ${d.gender==='Unisex'?'selected':''}>Unisex</option>
                                <option value="N/A" ${d.gender==='N/A'?'selected':''}>N/A</option>
                            </select>
                        </div>
                        <div>
                            <label>DescripciÃ³n:</label>
                            <textarea id="desc-${d.id}" rows="2">${d.description}</textarea>
                        </div>
                        <div class="file-input-group">
                            <label>Reemplazar Video (.mp4) Opcional:</label>
                            <input type="file" id="video-${d.id}" accept="video/mp4">
                        </div>
                        <div class="file-input-group">
                            <label>Reemplazar Logo Org (.png) Opcional:</label>
                            <input type="file" id="logo-${d.id}" accept="image/png">
                        </div>
                        <div class="file-input-group">
                            <label>Reemplazar Logo Ciudad (.png) Opcional:</label>
                            <input type="file" id="city-${d.id}" accept="image/png, image/jpeg">
                        </div>
                        <div class="actions">
                            <button class="btn-save" id="btn-save-${d.id}" onclick="updateDesign('${d.id}')">Guardar</button>
                            <button class="btn-delete" onclick="deleteDesign('${d.id}')">Eliminar</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                grid.innerHTML = '<p>Error de conexiÃ³n con el backend.</p>';
            }
        };

        const deleteDesign = async (id) => {
            if(!confirm('Â¿EstÃ¡s seguro de eliminar este diseÃ±o?')) return;
            try {
                await fetch('/api/designs/' + id, { method: 'DELETE' });
                loadDashboard();
            } catch(e) { alert('Error eliminando'); }
        };

        const updateDesign = async (id) => {
            const btn = document.getElementById('btn-save-' + id);
            btn.innerText = 'Guardando...';
            btn.disabled = true;

            const title = document.getElementById('title-'+id).value;
            const category = document.getElementById('category-'+id).value;
            const gender = document.getElementById('gender-'+id).value;
            const desc = document.getElementById('desc-'+id).value;
            
            const videoFile = document.getElementById('video-'+id).files[0];
            const logoFile = document.getElementById('logo-'+id).files[0];
            const cityLogoFile = document.getElementById('city-'+id).files[0];
            
            const formData = new FormData();
            formData.append('title', title);
            formData.append('category', category);
            formData.append('description', desc);
            formData.append('gender', gender);
            
            if (videoFile) formData.append('videoFile', videoFile);
            if (logoFile) formData.append('logoFile', logoFile);
            if (cityLogoFile) formData.append('cityLogoFile', cityLogoFile);

            try {
                const res = await fetch('/api/designs/' + id, {
                    method: 'PUT',
                    body: formData
                });
                
                if (res.ok) {
                    alert('DiseÃ±o actualizado correctamente');
                    loadDashboard();
                } else {
                    alert('Error al actualizar el diseÃ±o');
                }
            } catch(e) { 
                alert('Fallo de red al actualizar'); 
            } finally {
                btn.innerText = 'Guardar';
                btn.disabled = false;
            }
        };

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
