version: '3.8'

services:
  web:
    build: .
    container_name: srmartinez_web
    restart: always
    ports:
      - "80:80"
    volumes:
      # Mount Nginx config so you can update it without rebuilding the whole image
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VIRTUAL_HOST=srmartinez.site,www.srmartinez.site
