<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Portal | Login</title>
    <link rel="icon" type="image/png" href="./logo/logo_sinfondo.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 208, 47, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-box h2 {
            color: var(--color-primary);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #ccc; }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 4px;
            font-family: 'Poppins', sans-serif;
        }
        .form-group input:focus { outline: none; border-color: var(--color-primary); }
        .btn-login {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
        }
        #errorMsg { color: #ff4444; margin-top: 1rem; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 class="gta-font">Acceso Restringido</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>ContraseÃ±a</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-primary btn-login">Ingresar</button>
            <p id="errorMsg"></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('errorMsg');
            err.innerText = '';
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                if (res.ok) {
                    window.location.href = '/design-dashboard.html';
                } else {
                    err.innerText = 'Credenciales incorrectas.';
                }
            } catch (e) {
                err.innerText = 'Error de conexión.';
            }
        });
    </script>
</body>
</html>
