<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Portal | Subir Diseño</title>
    <link rel="icon" type="image/png" href="./logo/logo_sinfondo.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            background-color: var(--color-bg);
            color: var(--color-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .upload-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 208, 47, 0.2);
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .upload-container h2 {
            color: var(--color-primary);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: 'Poppins', sans-serif;
            color: #ddd;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
        }
        .form-group input[type="file"] {
            padding: 0.5rem;
            background: transparent;
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            margin-top: 1rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #aaa;
            text-decoration: none;
        }
        .back-link:hover {
            color: var(--color-primary);
        }
    </style>
</head>
<body>

    <div class="upload-container">
        <form id="uploadForm">
            <h2 class="gta-font">Subir Diseño</h2>
            
            <div class="form-group">
                <label for="title">Título del Diseño / Organización</label>
                <input type="text" id="title" placeholder="Ej: Akuma Motors Club" required>
            </div>

            <div class="form-group">
                <label for="category">Categoría (Sección)</label>
                <select id="category" required>
                    <option value="Prendas Personalizadas">Prendas Personalizadas</option>
                    <option value="Vehículos Personalizados">Vehículos Personalizados</option>
                    <option value="Mapeos">Mapeos</option>
                    <option value="Scripts">Scripts</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>

            <div class="form-group">
                <label for="gender">Género (Si aplica)</label>
                <select id="gender" required>
                    <option value="Hombre">Hombre</option>
                    <option value="Mujer">Mujer</option>
                    <option value="Unisex">Unisex</option>
                    <option value="N/A">No Aplica</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" rows="3" placeholder="Detalles del diseño..." required></textarea>
            </div>

            <div class="form-group">
                <label for="videoFile">Video MP4 (Showcase)</label>
                <input type="file" id="videoFile" accept="video/mp4" required>
            </div>

            <div class="form-group">
                <label for="logoFile">Logo de Organización (.png)</label>
                <input type="file" id="logoFile" accept="image/png" required>
            </div>

            <div class="form-group">
                <label for="cityLogoFile">Logo de la Ciudad/Server (.png) Opcional</label>
                <input type="file" id="cityLogoFile" accept="image/png, image/jpeg">
            </div>

            <button type="button" class="btn-primary btn-submit" id="generateBtn">Procesar Diseño</button>
            <a href="/design-dashboard.html" class="back-link">Ir al Panel de Control</a>
        </form>
    </div>

    <script>
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const btn = document.getElementById('generateBtn');
            btn.innerText = 'Subiendo archivos...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('gender', document.getElementById('gender').value);
            
            formData.append('videoFile', document.getElementById('videoFile').files[0]);
            formData.append('logoFile', document.getElementById('logoFile').files[0]);
            const cityLogo = document.getElementById('cityLogoFile').files[0];
            if (cityLogo) formData.append('cityLogoFile', cityLogo);

            if(!document.getElementById('title').value || !document.getElementById('videoFile').files[0] || !document.getElementById('logoFile').files[0]) {
                alert('Faltan campos obligatorios');
                btn.innerText = 'Procesar Diseño';
                btn.disabled = false;
                return;
            }

            try {
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    alert('¡Diseño subido con éxito!');
                    window.location.href = '/design-dashboard.html';
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.error);
                }
            } catch (error) {
                alert('Fallo de red al conectar con el servidor.');
            } finally {
                btn.innerText = 'Procesar Diseño';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
